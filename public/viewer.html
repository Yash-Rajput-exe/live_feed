<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StreamSync Viewer — Watch a live camera stream using a 6-digit code." />
    <title>Watch Stream | StreamSync</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* ── Viewer-specific extras ── */
      .viewer-wrapper {
        display: grid;
        gap: 18px;
      }

      /* Big centered code input area */
      .code-entry-card {
        padding: 28px;
        text-align: center;
      }

      .code-entry-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
      }

      .code-entry-sub {
        font-size: 0.85rem;
        color: var(--text-3);
        margin-bottom: 20px;
      }

      .code-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }

      /* Fullscreen button in corner of video */
      .fs-btn {
        position: absolute;
        bottom: 14px;
        right: 14px;
        z-index: 3;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.12);
        color: #fff;
        font-size: 0.95rem;
        display: grid;
        place-items: center;
        backdrop-filter: blur(6px);
        cursor: pointer;
        opacity: 0;
        transition: opacity 200ms, transform 200ms;
      }

      .video-frame:hover .fs-btn { opacity: 1; }
      .fs-btn:hover { transform: scale(1.08); }

      /* Status bar under video */
      .video-status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-radius: var(--r-sm);
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--text-3);
        margin-top: 14px;
        gap: 12px;
      }

      .status-row-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }

      /* Loading overlay inner text */
      .loading-overlay .loading-label {
        color: var(--text-2);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      /* Digit boxes for code input */
      .code-digits {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 4px;
      }

      /* Quality pill on video */
      .quality-pill {
        position: absolute;
        bottom: 14px;
        left: 14px;
        z-index: 3;
        padding: 4px 10px;
        border-radius: 99px;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--cyan-light);
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        backdrop-filter: blur(6px);
        display: none;
      }

      .is-streaming .quality-pill { display: inline-flex; }
    </style>
  </head>
  <body>
    <main class="page-shell app-shell">

      <!-- ── Header ── -->
      <header class="app-header">
        <a class="brand" href="/">
          <span class="brand-mark">📡</span>
          <span>StreamSync</span>
        </a>
        <nav class="top-nav" aria-label="Main navigation">
          <a href="/broadcast">🔴 Go Live</a>
        </nav>
      </header>

      <!-- ── Main Viewer Layout ── -->
      <div class="viewer-layout">
        <div class="viewer-wrapper">

          <!-- ── Video Card ── -->
          <div class="glass-card video-card">
            <div class="video-header">
              <div>
                <span class="eyebrow">Live Feed</span>
                <h1>Watching Stream</h1>
              </div>
              <span id="statusBadge" class="status-badge" data-tone="neutral">● Disconnected</span>
            </div>

            <div class="video-frame large" id="videoFrame">
              <video id="remoteVideo" autoplay playsinline muted></video>

              <!-- Loading overlay -->
              <div id="loadingOverlay" class="loading-overlay" hidden>
                <div class="spinner"></div>
                <span class="loading-label">Connecting to stream…</span>
              </div>

              <!-- Overlays on video -->
              <div class="quality-pill">HD · LIVE</div>
              <button class="fs-btn" id="fullscreenVideo" title="Fullscreen">⛶</button>
            </div>

            <!-- Status bar under video -->
            <div class="video-status-bar">
              <div class="status-row-item">
                <span>🌐</span>
                <span>Network:</span>
                <strong id="networkBadge" data-tone="neutral">Checking…</strong>
              </div>
              <div class="status-row-item">
                <span>🔗</span>
                <span>WebRTC P2P</span>
              </div>
              <div class="status-row-item">
                <span>🔒</span>
                <span>Encrypted</span>
              </div>
            </div>

            <p id="messageBox" class="message" data-tone="neutral" hidden></p>
          </div>

          <!-- ── Code Entry Card ── -->
          <div class="glass-card code-entry-card" id="connectPanel">
            <p class="code-entry-title">Enter Stream Code</p>
            <p class="code-entry-sub">Ask your broadcaster for their 6-character code</p>

            <input
              id="streamCodeInput"
              type="text"
              inputmode="text"
              autocomplete="off"
              maxlength="6"
              placeholder="ABC123"
              aria-label="Stream code"
            />

            <div class="code-actions">
              <button id="connectStream" class="button primary" type="button">
                ▶ Connect
              </button>
              <button id="disconnectStream" class="button danger" type="button" hidden>
                ✕ Disconnect
              </button>
            </div>

            <p class="connect-hint" style="margin-top:14px">
              Codes are 6 characters · letters and numbers
            </p>
          </div>

        </div>
      </div>

    </main>

    <script src="/js/socket.io.min.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/viewer.js"></script>
    <script>
      // Auto-unmute on first user interaction
      const video = document.getElementById('remoteVideo');
      document.addEventListener('click', () => {
        if (video.muted) { video.muted = false; }
      }, { once: true });
    </script>
  </body>
</html>
