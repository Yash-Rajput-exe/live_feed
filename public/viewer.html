<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StreamSync Viewer — Watch a live stream using a 6-digit code." />
    <title>Watch Stream — StreamSync</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-layout">

    <!-- ── Top Bar ── -->
    <header class="topbar">
      <div class="topbar-inner">

        <a class="logo" href="/">
          <span class="logo-mark">S</span>
          StreamSync
        </a>

        <div class="topbar-center">
          <span id="statusBadge" class="status-badge" data-tone="neutral">Disconnected</span>
        </div>

        <div class="topbar-right">
          <a class="btn btn-ghost btn-sm" href="/broadcast">Go Live</a>
        </div>

      </div>
    </header>

    <!-- ── Main ── -->
    <main class="viewer-main">

      <!-- ── Video Section ── -->
      <div class="viewer-video-section">

        <div class="viewer-meta">
          <span class="preview-title">Live Feed</span>
        </div>

        <!-- Video player -->
        <div class="video-wrap" id="videoFrame">
          <video id="remoteVideo" autoplay playsinline muted></video>

          <!-- Loading overlay — shown by JS via .visible class -->
          <div id="loadingOverlay" class="loading-overlay">
            <div class="spinner"></div>
            <span class="loading-label">Connecting to stream…</span>
          </div>

          <!-- Empty state — shown before connecting -->
          <div class="video-empty-state" id="viewerEmpty">
            <div class="video-empty-icon">📺</div>
            <div class="video-empty-text">No stream connected</div>
            <div class="video-empty-sub">Enter a code below to start watching</div>
          </div>

          <!-- Fullscreen button -->
          <button class="video-fs-btn" id="fullscreenVideo" title="Fullscreen" aria-label="Toggle fullscreen">
            ⛶
          </button>
        </div>

        <!-- Info bar below video -->
        <div class="viewer-info-bar">
          <div class="info-bar-group">
            <div class="info-bar-item">
              <span class="info-bar-dot"></span>
              Network: <strong id="networkBadge" data-tone="neutral" style="margin-left:3px">Checking</strong>
            </div>
          </div>
          <div class="info-bar-group">
            <div class="info-bar-item">🔒 Encrypted</div>
            <div class="info-bar-item">⚡ WebRTC P2P</div>
          </div>
        </div>

        <!-- Message box — shown/hidden by JS -->
        <p id="messageBox" class="message" data-tone="neutral" hidden></p>

      </div>

      <!-- ── Connect Panel ── -->
      <div class="viewer-connect-section">
        <div class="card">
          <div class="card-body">
            <span class="section-label">Enter Stream Code</span>
            <input
              id="streamCodeInput"
              type="text"
              inputmode="text"
              autocomplete="off"
              maxlength="6"
              placeholder="ABC123"
              aria-label="Stream code"
            />
            <div class="connect-actions">
              <button id="connectStream" type="button">Connect</button>
              <button id="disconnectStream" type="button" hidden>Disconnect</button>
            </div>
          </div>
        </div>
      </div>

    </main>

    <script src="/js/socket.io.min.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/viewer.js"></script>
    <script>
      // Hide empty state once remote video starts
      const remoteVid = document.getElementById('remoteVideo');
      const viewerEmpty = document.getElementById('viewerEmpty');

      remoteVid.addEventListener('loadeddata', () => {
        viewerEmpty.style.display = 'none';
      });

      // Auto-unmute on first user interaction
      document.addEventListener('click', () => {
        if (remoteVid.muted) remoteVid.muted = false;
      }, { once: true });
    </script>
  </body>
</html>
