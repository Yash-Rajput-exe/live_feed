<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StreamSync Broadcaster — Start a live camera stream and share your code." />
    <title>Broadcast — StreamSync</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-layout">

    <!-- Toast — kept for copy feedback script below -->
    <div class="copy-toast" id="copyToast">Code copied</div>

    <!-- ── Top Bar ── -->
    <header class="topbar">
      <div class="topbar-inner">

        <a class="logo" href="/">
          <span class="logo-mark">S</span>
          StreamSync
        </a>

        <!-- Live status shown in topbar center (via statusBadge) -->
        <div class="topbar-center">
          <span id="statusBadge" class="status-badge" data-tone="neutral">Offline</span>
        </div>

        <div class="topbar-right">
          <a class="btn btn-ghost btn-sm" href="/viewer">Watch Stream</a>
        </div>

      </div>
    </header>

    <!-- ── Main ── -->
    <main class="broadcast-main">

      <!-- ── Left: Camera Preview ── -->
      <div class="preview-panel">

        <div class="preview-header">
          <span class="preview-title">Camera Preview</span>
        </div>

        <!-- Video -->
        <div class="video-wrap preview-ratio" id="videoFrame">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="live-pill" aria-hidden="true">LIVE</div>

          <!-- Empty state shown before camera starts -->
          <div class="video-empty-state" id="previewEmpty">
            <div class="video-empty-icon">📷</div>
            <div class="video-empty-text">Camera not started</div>
            <div class="video-empty-sub">Click Start Stream to begin</div>
          </div>
        </div>

        <!-- Message Box — shown/hidden by JS -->
        <p id="messageBox" class="message" data-tone="neutral" hidden></p>

      </div>

      <!-- ── Right: Controls Panel ── -->
      <aside class="controls-panel">

        <!-- Stream Code -->
        <div class="card code-section">
          <div class="card-body" style="padding-bottom: 12px;">
            <span class="section-label">Stream Code</span>
            <div class="code-display-wrap">
              <div id="streamCode">——————</div>
            </div>
          </div>
          <div class="card-footer" style="padding-top: 10px;">
            <div class="code-actions">
              <button id="copyCode" class="btn btn-secondary" type="button" disabled>
                Copy Code
              </button>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="card stats-section">
          <span class="section-label">Stream Stats</span>
          <div class="stat-row">
            <span class="stat-key">Viewers</span>
            <span class="stat-val" id="viewerCount">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-key">Connection</span>
            <span class="stat-val" id="viewerState">Waiting</span>
          </div>
          <div class="stat-row">
            <span class="stat-key">Network</span>
            <span class="stat-val" id="networkBadge" data-tone="neutral">Checking</span>
          </div>
        </div>

        <!-- Input Devices -->
        <div class="card devices-section">
          <span class="section-label">Input Devices</span>

          <div class="field">
            <label class="field-label" for="cameraSelect">Camera</label>
            <select id="cameraSelect"></select>
          </div>

          <div class="field">
            <label class="field-label" for="microphoneSelect">Microphone</label>
            <select id="microphoneSelect"></select>
          </div>
        </div>

        <!-- Actions -->
        <div class="action-section">
          <button id="startStream" type="button">Start Streaming</button>
          <button id="stopStream" type="button" hidden>Stop Stream</button>
        </div>

      </aside>

    </main>

    <script src="/js/socket.io.min.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/broadcast.js"></script>
    <script>
      // Hide empty state once video starts
      const localVid = document.getElementById('localVideo');
      const previewEmpty = document.getElementById('previewEmpty');
      localVid.addEventListener('loadeddata', () => {
        previewEmpty.style.display = 'none';
      });

      // Copy toast feedback
      document.getElementById('copyCode').addEventListener('click', () => {
        const toast = document.getElementById('copyToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    </script>
  </body>
</html>
