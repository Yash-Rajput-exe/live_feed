<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Camera Stream</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page-shell landing-shell">
      <section class="hero-grid">
        <div class="hero-copy">
          <a class="brand" href="/" aria-label="Live Camera Stream home">
            <span class="brand-mark">LC</span>
            <span>Live Camera Stream</span>
          </a>
          <h1>Live Camera Stream</h1>
          <p>
            Start a private live camera feed from one device and let another device watch instantly
            with a short stream code.
          </p>
          <div class="action-row">
            <a class="button primary" href="/broadcast">Start Broadcasting</a>
            <a class="button secondary" href="/viewer">Watch Stream</a>
          </div>
        </div>

        <div class="glass-card hero-panel" aria-label="Live streaming workflow">
          <div class="signal-ring">
            <span></span>
            <span></span>
            <span></span>
            <div class="camera-dot"></div>
          </div>
          <div class="hero-metric">
            <span class="metric-label">Stream Code</span>
            <strong>ABC123</strong>
          </div>
          <div class="flow-list">
            <div>
              <span>1</span>
              Camera opens
            </div>
            <div>
              <span>2</span>
              Code is shared
            </div>
            <div>
              <span>3</span>
              Viewers connect live
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
